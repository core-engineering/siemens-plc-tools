[project]
name = "plc-sim"
version = "0.1.0"
description = "OPC UA simulation interface for live PLC interaction and integration testing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Camille Martin", email = "cma@core-engineering.fr" }
]
keywords = ["plc", "opcua", "simulation", "tia-portal", "integration-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "plc-core[opcua]>=0.1.0",
    "plc-modbus>=0.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.entry-points."plc_tools.plugins"]
sim = "plc_sim.cli:sim_group"

[project.urls]
Homepage = "https://github.com/core-engineering/siemens-plc-tools"
Repository = "https://github.com/core-engineering/siemens-plc-tools"
Issues = "https://github.com/core-engineering/siemens-plc-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_sim"]

[tool.black]
line-length = 110
target-version = ['py312']

[tool.ruff]
# Single source of truth: the workspace root. A per-package copy of these rules
# meant six configs drifting independently — a rule added at the root silently
# skipped every package that carried its own block.
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/plc_sim --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "asyncua",
    "asyncua.*",
    "rich",
    "rich.*",
    "pydantic",
    "pydantic.*",
]
ignore_missing_imports = true
