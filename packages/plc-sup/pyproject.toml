[project]
name = "plc-sup"
version = "0.3.0"
description = "Supervision pipeline testing for PLC systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Camille Martin", email = "cma@core-engineering.fr" }
]
keywords = ["plc", "supervision", "opcua", "redis", "postgresql", "integration-testing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "plc-core[opcua]==0.3.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.entry-points."plc_tools.plugins"]
sup = "plc_sup.cli:sup_group"

[project.urls]
Homepage = "https://github.com/core-engineering/siemens-plc-tools"
Repository = "https://github.com/core-engineering/siemens-plc-tools"
Issues = "https://github.com/core-engineering/siemens-plc-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_sup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=src/plc_sup --cov-report=term-missing"

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
# Single source of truth: the workspace root. A per-package copy of these rules
# meant six configs drifting independently — a rule added at the root silently
# skipped every package that carried its own block.
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
