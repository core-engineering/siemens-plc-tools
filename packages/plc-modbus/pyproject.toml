[project]
name = "plc-modbus"
version = "0.1.0"
description = "Modbus TCP client for PLC integration testing — pairs with plc-sim/plc-core test runner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Camille Martin", email = "cma@core-engineering.fr" }
]
keywords = ["plc", "modbus", "modbus-tcp", "industrial-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymodbus>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/core-engineering/siemens-plc-tools"
Repository = "https://github.com/core-engineering/siemens-plc-tools"
Issues = "https://github.com/core-engineering/siemens-plc-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_modbus"]

[tool.black]
line-length = 110
target-version = ['py312']

[tool.ruff]
# Single source of truth: the workspace root. A per-package copy of these rules
# meant six configs drifting independently — a rule added at the root silently
# skipped every package that carried its own block.
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src/plc_modbus --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pymodbus",
    "pymodbus.*",
]
ignore_missing_imports = true
