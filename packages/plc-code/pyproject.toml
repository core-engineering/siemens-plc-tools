[project]
name = "plc-code"
version = "0.1.0"
description = "SCL code analysis, documentation generation, and quality tools for TIA Portal V21"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Camille Martin", email = "cma@core-engineering.fr" }
]
keywords = ["plc", "scl", "tia-portal", "code-analysis", "documentation-generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "plc-core>=0.1.0",
    "jinja2>=3.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=0.24.0",
    "python-docx>=1.0.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.entry-points."plc_tools.plugins"]
code = "plc_code.cli:code_group"

[project.entry-points."pygments.lexers"]
scl = "plc_code.highlighting:SCLLexer"

[project.urls]
Homepage = "https://github.com/core-engineering/siemens-plc-tools"
Repository = "https://github.com/core-engineering/siemens-plc-tools"
Issues = "https://github.com/core-engineering/siemens-plc-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_code"]

[tool.black]
line-length = 110
target-version = ['py312']

[tool.ruff]
# Single source of truth: the workspace root. A per-package copy of these rules
# meant six configs drifting independently — a rule added at the root silently
# skipped every package that carried its own block.
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib --cov=src/plc_code --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "jinja2",
    "jinja2.*",
    "rich",
    "rich.*",
    "pygments",
    "pygments.*",
    "docx",
    "docx.*",
]
ignore_missing_imports = true
